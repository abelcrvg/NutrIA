name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android project files
        run: flutter create --platforms=android --project-name=nutria .

      - name: Repair Dart source before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('lib/main.dart')
          text = main.read_text()
          broken = "OutlinedButton.icon(onPressed:()=>supabase.auth.signOut(),icon:const Icon(Icons.logout),label:const Text('Sair da conta'))]))];}"
          fixed = "OutlinedButton.icon(onPressed:()=>supabase.auth.signOut(),icon:const Icon(Icons.logout),label:const Text('Sair da conta'))]));}"
          if broken in text:
              text = text.replace(broken, fixed, 1)
              main.write_text(text)
          entry = Path('lib/meal_entry.dart')
          text = entry.read_text().replace('DropdownButtonFormField<String>(initialValue:', 'DropdownButtonFormField<String>(value:')
          entry.write_text(text)
          matching = Path('lib/meal_matching.dart')
          text = matching.read_text()
          if 'IconData feedbackIcon(' not in text:
              text += "\nIconData feedbackIcon(String status) {\n  switch (status) {\n    case 'positive': return Icons.check_circle_outline;\n    case 'attention': return Icons.warning_amber_outlined;\n    case 'important': return Icons.error_outline;\n    default: return Icons.info_outline;\n  }\n}\n"
              matching.write_text(text)
          PY
          dart format lib
          flutter analyze --no-pub

      - name: Configure Android network and NDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', permission + '    <application', 1)
              manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          desired = '27.0.12077973'
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if 'ndkVersion' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}ndkVersion = "{desired}"'
                  break
          else:
              lines.insert(1, f'    ndkVersion = "{desired}"')
          gradle.write_text('\n'.join(lines) + '\n')
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutria-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
