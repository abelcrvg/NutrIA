name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'
      - name: Clean Flutter build
        run: flutter clean
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Build Android APK with Gradle
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          mkdir -p build/app/outputs/flutter-apk
          APK=$(find android/app/build/outputs/flutter-apk android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' 2>/dev/null | head -n 1)
          test -n "$APK"
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutria-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
